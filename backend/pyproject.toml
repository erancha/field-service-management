[project]
name = "fsm"
version = "0.1.0"
description = "Field Service Management system"
license = "MIT"
authors = [{ name = "Eran C", email = "erancha@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "google-auth>=2.0",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.2",
    "itsdangerous>=2.0",
    "cryptography>=42",
    "redis>=5",
    "structlog>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "import-linter>=2.0",
    "testcontainers[postgres]>=4.5",
    "ruff>=0.15",
    "mypy>=2.0",
]

[project.urls]
Repository = "https://github.com/erancha/field-service-management"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Third-party: Starlette's TestClient warns about its own httpx usage (its planned migration to
    # httpx2). Not actionable in our code; remove when FastAPI/Starlette complete that migration.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
src = ["src", "tests"]

[tool.mypy]
# Type-checks src only: tests exercise typed code but lean on fixtures and monkeypatching that
# static analysis cannot follow without heavy annotation churn.
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Google's API client libraries ship no py.typed marker and have no maintained stubs.
module = ["googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["fsm"]
# import-linter 2.x requires this to resolve external packages named in forbidden_modules
# (google, googleapiclient, fastapi); without it those contracts error instead of being checked.
include_external_packages = true

# Import boundaries, checked transitively. Allowed access, top to bottom:
#   fsm.platform -> every fsm package (composition root; the only package that sees everything)
#   each context (calendar, identity, notifications, scheduling)
#                -> itself and fsm.shared only; never another context, never fsm.platform
#   fsm.shared   -> nothing in fsm
# Within a context, layers import downward only (adapters -> application -> ports -> domain);
# domain, application, and ports use only the context itself and the standard library, so
# adapters is the sole layer that may import fsm.shared or infrastructure libraries.

[[tool.importlinter.contracts]]
name = "Platform composes independent contexts over the shared kernel"
type = "layers"
layers = [
    "fsm.platform",
    "fsm.calendar | fsm.identity | fsm.notifications | fsm.scheduling",
    "fsm.shared",
]

[[tool.importlinter.contracts]]
name = "Contexts follow hexagonal layering (adapters over application over ports over domain)"
type = "layers"
containers = ["fsm.calendar", "fsm.identity", "fsm.notifications", "fsm.scheduling"]
layers = [
    "adapters",
    "application",
    "ports",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Inner layers stay pure: own context, abstractions, and the standard library only"
type = "forbidden"
source_modules = [
    "fsm.calendar.domain",
    "fsm.calendar.application",
    "fsm.calendar.ports",
    "fsm.identity.domain",
    "fsm.identity.application",
    "fsm.identity.ports",
    "fsm.notifications.domain",
    "fsm.notifications.application",
    "fsm.notifications.ports",
    "fsm.scheduling.domain",
    "fsm.scheduling.application",
    "fsm.scheduling.ports",
]
forbidden_modules = [
    "fsm.shared",
    "sqlalchemy",
    "fastapi",
    "google",
    "googleapiclient",
    "cryptography",
    "smtplib",
]

[[tool.importlinter.contracts]]
name = "Neither contexts nor the shared kernel import the web framework"
type = "forbidden"
source_modules = [
    "fsm.calendar",
    "fsm.identity",
    "fsm.notifications",
    "fsm.scheduling",
    "fsm.shared",
]
forbidden_modules = [
    "fastapi",
]

[[tool.importlinter.contracts]]
name = "Scheduling never imports integration libraries"
type = "forbidden"
source_modules = ["fsm.scheduling"]
forbidden_modules = [
    "google",
    "googleapiclient",
]
