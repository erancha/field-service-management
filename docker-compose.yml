# One backend image runs migrations and all role services; they differ only by command and FSM_ROLE.
x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

# Operator config (Google, SMTP, Fernet key, runner flags, ...) comes from backend/.env so the
# Docker path honors the same configuration as host mode. Optional: absent on a fresh checkout.
# The inline `environment` below overrides DATABASE_URL to the in-network `db` host regardless of
# what .env sets for the host path.
x-backend-env-file: &backend-env-file
  - path: ./backend/.env
    required: false

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://fsm:fsm@db:5432/fsm
  APP_ENV: local
  # Shared pub/sub broker so an event published in one role process (e.g. a customer's sign-in)
  # reaches SSE streams connected to another role process (e.g. the back office).
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000

# Shared liveness-probe timing for the role backends; nginx gates startup on these becoming healthy.
# Each service supplies its own `test` (the role port differs); the slim image has no curl, so the
# probe uses Python's urllib, which is always present.
x-backend-healthcheck: &backend-healthcheck
  interval: 3s
  timeout: 3s
  retries: 20

# Hard memory ceiling per backend process; without it a container may grow to all host RAM. 256M
# comfortably covers the ~90MB resident set of a uvicorn role process.
x-backend-deploy: &backend-deploy
  resources:
    limits:
      memory: 256M

services:
  db:
    image: pgvector/pgvector:pg16
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      POSTGRES_USER: fsm
      POSTGRES_PASSWORD: fsm
      POSTGRES_DB: fsm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fsm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsm -d fsm"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    # Covers the image's declared VOLUME /data with tmpfs: redis serves this stack purely as a
    # pub/sub broker, so its state needs no volume at all.
    tmpfs:
      - /data
    deploy:
      resources:
        limits:
          memory: 128M
    # Published so host-mode processes (one uvicorn per role) can share the same broker at
    # localhost:6379; the Docker path reaches it in-network as redis:6379.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  # Object storage for customer photos attached in the triage chat: originals plus the
  # model-sized previews. Postgres holds only metadata rows.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      MINIO_ROOT_USER: fsm
      MINIO_ROOT_PASSWORD: fsm-minio-local
    # Published on every interface so a photo object can be fetched from a device other than this
    # host — a technician opening the calendar event on a phone. The host port stays off MinIO's
    # default 9000 so this stack coexists with another local S3 store already holding it.
    # Host-mode backends reach the store at localhost:9100; Docker-mode backends reach it
    # in-network as minio:9000.
    ports:
      - "9100:9000"
    volumes:
      - fsm_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 15

  migrate:
    build: *backend-build
    image: fsm-backend:local
    command: alembic upgrade head
    deploy:
      <<: *backend-deploy
    env_file: *backend-env-file
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy

  technician:
    build: *backend-build
    image: fsm-backend:local
    command: uvicorn fsm.platform.app:create_app --factory --host 0.0.0.0 --port 8001
    env_file: *backend-env-file
    environment:
      <<: *backend-env
      FSM_ROLE: technician
    # Several interchangeable processes for this role. They all bind 8001 inside their own container
    # network namespace, so there is no port conflict; nginx reaches them by the `technician` service
    # name, which resolves to every replica. Publishing a host port is incompatible with replicas > 1.
    deploy:
      <<: *backend-deploy
      replicas: 2
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  customer:
    build: *backend-build
    image: fsm-backend:local
    command: uvicorn fsm.platform.app:create_app --factory --host 0.0.0.0 --port 8002
    env_file: *backend-env-file
    environment:
      <<: *backend-env
      FSM_ROLE: customer
    # Five interchangeable processes, reached by nginx through the `customer` service name. All bind
    # 8002 in their own container namespace — no conflict — and none publishes a host port.
    deploy:
      <<: *backend-deploy
      replicas: 5
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  backoffice:
    build: *backend-build
    image: fsm-backend:local
    command: uvicorn fsm.platform.app:create_app --factory --host 0.0.0.0 --port 8003
    env_file: *backend-env-file
    environment:
      <<: *backend-env
      FSM_ROLE: backoffice
      # This role process runs the background calendar workers for the whole deployment: it drains
      # the outbox to Google (outbound projection) and polls Google for technician-side edits
      # (inbound sync). Exactly one process may run them, so technician/customer leave them at the
      # config default (off) and only backoffice turns them on.
      FSM_DISPATCH_ENABLED: "true"
      FSM_SYNC_ENABLED: "true"
      # The dispatcher above writes photo links into calendar events, and a link clicked from
      # Google must be an absolute address on the technician-facing edge — nginx publishes that
      # role on localhost:8001. Export TECHNICIAN_APP_URL before launching to point links at a
      # public deployment instead.
      TECHNICIAN_APP_URL: "${TECHNICIAN_APP_URL:-http://localhost:8001}"
    # Pinned to one process because it owns the calendar workers above (exactly one may run them).
    # Scaling this role would require moving the workers to a single dedicated process first.
    deploy:
      <<: *backend-deploy
      replicas: 1
      # Knowledge-base ingest runs in this role: pypdf's parse of a near-cap (20 MB) manual peaks
      # tens of MB above the shared ceiling, and a repeat ingest starts from heap the allocator
      # has not returned to the OS, so consecutive uploads ratchet the resident set upward. The
      # shared 256M ceiling OOM-kills the process mid-ingest; 512M covers the peak with headroom.
      resources:
        limits:
          memory: 512M
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
    # No host port: nginx is the sole entry point; reachable as `backoffice:8003` on the compose
    # network. ADMIN_EMAILS (in backend/.env) governs who this host grants the admin role to.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Single edge and the only published entry point: serves the built SPA and reverse-proxies each role
  # to its (internal) backend on a dedicated localhost port. localhost:8001 -> technician:8001,
  # localhost:8002 -> customer:8002, localhost:8003 -> backoffice:8003. Per-port (not per-subdomain)
  # because Google only accepts localhost:<port> as a loopback OAuth redirect URI, not *.localhost.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: fsm-nginx:local
    deploy:
      resources:
        limits:
          memory: 64M
    ports:
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
    depends_on:
      technician:
        condition: service_healthy
      customer:
        condition: service_healthy
      backoffice:
        condition: service_healthy

volumes:
  fsm_pgdata:
  fsm_minio:
