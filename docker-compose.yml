# Field Service Management's services: Postgres, Redis, the object store, the one-shot migration,
# the role replicas, the calendar worker and the nginx edge the browser reaches the roles through.
# The scripts call compose from this directory, so relative paths resolve from the repo root.
# Settings come from the files under scripts/lib/ (stack-params.sh, params.sh, secrets.sh), which
# the scripts export into their shell before calling compose, so the ${...} values below
# interpolate; a bare docker compose call has none of them. Postgres, Redis and the object store
# bind to this machine's loopback interface only, since Docker otherwise publishes on every host
# interface and exposes the port to the whole network; the edge is the deliberate exception.
#
# Nothing is bind-mounted from this machine, so the same file runs against the EC2 instance's
# Docker daemon (docker-compose.ec2.yml): the edge's configuration and the built page are baked
# into its image, and the data lives in named volumes.
name: field-service-management

# One backend image runs the migration and every role service; they differ only by command and
# FSM_ROLE.
x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-backend-image: &backend-image fsm-backend:local

# The in-network address, overriding the host form secrets.sh holds.
x-database-env: &database-env
  DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?set in stack-params.sh}:\
    ${POSTGRES_PASSWORD:?set in secrets.sh}@db:${DB_PORT:?set in stack-params.sh}/\
    ${POSTGRES_DB:?set in stack-params.sh}"

# Each container receives only the settings it reads, listed once here for every backend process,
# since all of them read the same settings. A key listed without a value takes its value from the
# scripts' shell and stays unset when its settings file leaves it commented out, so the process
# keeps its default.
x-backend-env: &backend-env
  <<: *database-env
  APP_ENV:
  TIMEZONE:
  ADMIN_EMAILS:
  GOOGLE_CLIENT_ID:
  GOOGLE_CLIENT_SECRET:
  GOOGLE_REDIRECT_URI:
  GOOGLE_CALENDAR_REDIRECT_URI:
  SESSION_SECRET:
  FSM_TOKEN_KEY:
  TECHNICIAN_APP_URL:
  FSM_DISPATCH_INTERVAL_SECONDS:
  FSM_SYNC_INTERVAL_SECONDS:
  FSM_SYNC_LEASE_RETRY_SECONDS:
  FSM_BOOKING_CANCEL_LIMIT:
  FSM_BOOKING_CANCEL_WINDOW_HOURS:
  FSM_BOOKING_CANCEL_COOLOFF_HOURS:
  SMTP_HOST:
  SMTP_PORT:
  SMTP_USER:
  SMTP_PASS:
  SMTP_FROM:
  SMTP_USE_TLS:
  GOOGLE_API_KEY:
  HOLIDAY_CALENDAR_ID:
  HOLIDAY_REFRESH_YEARS_AHEAD:
  ASSIST_MODEL:
  ASSIST_EMBEDDINGS:
  ANTHROPIC_API_KEY:
  OPENAI_API_KEY:
  MINIO_ACCESS_KEY:
  MINIO_SECRET_KEY:
  MINIO_BUCKET:
  MINIO_SECURE:
  FSM_LOG_LEVEL:
  FSM_LOG_LEVELS:
  # In-network, like DATABASE_URL above. The shared pub/sub broker lets an event published in one
  # role process (a customer's sign-in) reach the event streams held by another (the back office).
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: objectstore:9000

# Shared liveness-probe timing for the role backends; nginx gates startup on these becoming healthy.
# Each service supplies its own `test` (the role port differs); the slim image has no curl, so the
# probe uses Python's urllib, which is always present.
x-backend-healthcheck: &backend-healthcheck
  interval: 3s
  timeout: 3s
  retries: 20

# Hard memory ceiling per backend process; without it a container may grow to all host RAM. A role
# process carrying no per-request peak settles around 180MB resident, so 256M leaves it roughly a
# third in reserve. Roles whose work has a known peak above that raise the ceiling themselves.
x-backend-deploy: &backend-deploy
  resources:
    limits:
      memory: 256M

services:
  db:
    image: pgvector/pgvector:pg16
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in stack-params.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in secrets.sh}
      POSTGRES_DB: ${POSTGRES_DB:?set in stack-params.sh}
      # Moves the server, and pg_isready below, off the default port.
      PGPORT: ${DB_PORT:?set in stack-params.sh}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:?set in stack-params.sh}:${DB_PORT:?set in stack-params.sh}"
    volumes:
      - fsm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    # Covers the image's declared VOLUME /data with tmpfs: redis serves this stack purely as a
    # pub/sub broker, so its state needs no volume at all.
    tmpfs:
      - /data
    deploy:
      resources:
        limits:
          memory: 128M
    # Published so backend processes started on the host share the same broker at
    # localhost:REDIS_HOST_PORT; the Docker path reaches it in-network as redis:6379.
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:?set in stack-params.sh}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  # Object storage for customer photos attached in the triage chat: originals plus the
  # model-sized previews. Postgres holds only metadata rows. The backend speaks plain S3 through
  # the minio client library, so any S3-compatible server can fill this slot; RustFS is the one
  # bundled here.
  objectstore:
    image: rustfs/rustfs:1.0.1
    command: /data
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set in stack-params.sh}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY:?set in secrets.sh}
    # Loopback-only like db and redis: a phone fetches a photo through the role APIs, never straight
    # from the store. Backends started on the host reach the store at
    # localhost:OBJECT_STORE_HOST_PORT; backends in Compose reach it as objectstore:9000.
    ports:
      - "127.0.0.1:${OBJECT_STORE_HOST_PORT:?set in stack-params.sh}:9000"
    volumes:
      - fsm_objectstore:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 15

  migrate:
    build: *backend-build
    image: *backend-image
    command: alembic upgrade head
    deploy:
      <<: *backend-deploy
    environment: *database-env
    depends_on:
      db:
        condition: service_healthy

  technician:
    build: *backend-build
    image: *backend-image
    command: uvicorn fsm.platform.app:create_app --factory --host 0.0.0.0 --port 8001
    environment:
      <<: *backend-env
      FSM_ROLE: technician
    # Several interchangeable processes for this role. They all bind 8001 inside their own
    # container network namespace, so there is no port conflict; nginx reaches them by the
    # `technician` service name, which resolves to every replica. Publishing a host port is
    # incompatible with replicas > 1.
    deploy:
      <<: *backend-deploy
      replicas: 2
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  customer:
    build: *backend-build
    image: *backend-image
    command: uvicorn fsm.platform.app:create_app --factory --host 0.0.0.0 --port 8002
    environment:
      <<: *backend-env
      FSM_ROLE: customer
    # Five interchangeable processes, reached by nginx through the `customer` service name. All bind
    # 8002 in their own container namespace — no conflict — and none publishes a host port.
    deploy:
      <<: *backend-deploy
      replicas: 5
      # This role carries the assist stack, which settles ~215MB resident — already near the shared
      # ceiling before it does any work. On top of that, a photo upload decodes here: a picture just
      # under the 25 MP guard peaks ~135MB above that while Pillow holds the decode, the transposed
      # copy, and the RGB conversion at once. 512M covers both together.
      resources:
        limits:
          memory: 512M
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  backoffice:
    build: *backend-build
    image: *backend-image
    command: uvicorn fsm.platform.app:create_app --factory --host 0.0.0.0 --port 8003
    environment:
      <<: *backend-env
      FSM_ROLE: backoffice
    # Serves HTTP only — the calendar loops live in the `worker` service below — so this role may
    # run as many replicas as the back office needs.
    deploy:
      <<: *backend-deploy
      replicas: 1
      # Knowledge-base ingest runs in this role: pypdf's parse of a near-cap (20 MB) manual peaks
      # tens of MB above the shared ceiling, and a repeat ingest starts from heap the allocator
      # has not returned to the OS, so consecutive uploads ratchet the resident set upward. The
      # shared 256M ceiling OOM-kills the process mid-ingest; 512M covers the peak with headroom.
      resources:
        limits:
          memory: 512M
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
    # No host port: nginx is the sole entry point; reachable as `backoffice:8003` on the compose
    # network. ADMIN_EMAILS (in params.sh) governs who this host grants the admin role to.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The calendar loops, in a process of their own so no HTTP role has to stay single-replica for
  # them: the outbound dispatcher drains the outbox to Google, the inbound poller reads technician
  # -side edits back. Only the poller may run once at a time, and it takes a lease to decide that,
  # so a second replica here is a warm standby rather than a misconfiguration — it idles until the
  # holder disconnects, then takes over. The dispatcher writes photo links into calendar events
  # from TECHNICIAN_APP_URL, the technician app's public address.
  worker:
    build: *backend-build
    image: *backend-image
    command: python -m fsm.platform.worker
    environment:
      <<: *backend-env
      FSM_ROLE: worker
    deploy:
      <<: *backend-deploy
      replicas: 1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Single edge and the only published entry point: serves the built SPA and reverse-proxies each
  # role to its (internal) backend on a port of its own: EDGE_TECHNICIAN_HOST_PORT ->
  # technician:8001, EDGE_CUSTOMER_HOST_PORT -> customer:8002, EDGE_BACKOFFICE_HOST_PORT ->
  # backoffice:8003. Per port, not per subdomain, because Google accepts only localhost:<port> as a
  # loopback OAuth redirect URI, not *.localhost.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: fsm-nginx:local
    deploy:
      resources:
        limits:
          memory: 64M
    ports:
      - "${EDGE_TECHNICIAN_HOST_PORT:?set in stack-params.sh}:8001"
      - "${EDGE_CUSTOMER_HOST_PORT:?set in stack-params.sh}:8002"
      - "${EDGE_BACKOFFICE_HOST_PORT:?set in stack-params.sh}:8003"
    depends_on:
      technician:
        condition: service_healthy
      customer:
        condition: service_healthy
      backoffice:
        condition: service_healthy

volumes:
  fsm_pgdata:
  fsm_objectstore:
