# Reverse proxy + static SPA host for local runs. Each role is served on its own localhost port, so
# the OAuth callback host is localhost:<port> — the only loopback form Google accepts as a redirect URI
# (it rejects *.localhost). nginx serves the shared single-page app and forwards the API surface to that
# role's backend; the blocks differ only by listen port and upstream. public.conf.template is the
# hostname-and-https counterpart, and replaces this file when the image runs with FSM_DOMAIN set.
include /etc/nginx/snippets/upstreams.conf;

server {
    listen 8001;

    include /etc/nginx/snippets/spa.conf;

    location ~ ^/(api|auth|calendar|docs|redoc|openapi\.json|health|ready)(/|$) {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://technician_backend;
    }
}

server {
    listen 8002;

    include /etc/nginx/snippets/spa.conf;

    location ~ ^/(api|auth|calendar|docs|redoc|openapi\.json|health|ready)(/|$) {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://customer_backend;
    }
}

server {
    listen 8003;

    include /etc/nginx/snippets/spa.conf;

    location ~ ^/(api|auth|calendar|docs|redoc|openapi\.json|health|ready)(/|$) {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://backoffice_backend;
    }
}
