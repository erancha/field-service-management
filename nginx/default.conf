# Reverse proxy + static SPA host for the FSM stack. Each role is a virtual host: nginx serves the
# shared single-page app and forwards the API surface to that role's backend. The role blocks differ
# only by server_name and upstream; the shared serving/proxy behavior lives in snippets/.
upstream technician_backend { server technician:8001; }
upstream customer_backend   { server customer:8002; }
upstream backoffice_backend { server backoffice:8003; }

# Hashed asset filenames make long-lived caching safe; compress text payloads on the wire.
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
    listen 80;
    server_name technician.localhost;

    include /etc/nginx/snippets/spa.conf;

    location ~ ^/(api|auth|calendar|docs|redoc|openapi\.json|health|ready)(/|$) {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://technician_backend;
    }
}

server {
    listen 80;
    server_name customer.localhost;

    include /etc/nginx/snippets/spa.conf;

    location ~ ^/(api|auth|calendar|docs|redoc|openapi\.json|health|ready)(/|$) {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://customer_backend;
    }
}

server {
    listen 80;
    server_name backoffice.localhost;

    include /etc/nginx/snippets/spa.conf;

    location ~ ^/(api|auth|calendar|docs|redoc|openapi\.json|health|ready)(/|$) {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://backoffice_backend;
    }
}

# Any other host (e.g. bare http://localhost) points the caller at a role host instead of guessing.
server {
    listen 80 default_server;
    server_name _;
    default_type text/plain;
    return 200 "FSM edge — open http://technician.localhost, http://customer.localhost, or http://backoffice.localhost\n";
}
