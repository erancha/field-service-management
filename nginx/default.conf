# Reverse proxy + static SPA host for the FSM stack. Each role is served on its own localhost port, so
# the OAuth callback host is localhost:<port> — the only loopback form Google accepts as a redirect URI
# (it rejects *.localhost). nginx serves the shared single-page app and forwards the API surface to that
# role's backend; the blocks differ only by listen port and upstream. A production edge fronts the same
# backends by hostname over https instead.
upstream technician_backend { server technician:8001; }
upstream customer_backend   { server customer:8002; }
upstream backoffice_backend { server backoffice:8003; }

# Hashed asset filenames make long-lived caching safe; compress text payloads on the wire.
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
    listen 8001;

    include /etc/nginx/snippets/spa.conf;

    location ~ ^/(api|auth|calendar|docs|redoc|openapi\.json|health|ready)(/|$) {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://technician_backend;
    }
}

server {
    listen 8002;

    include /etc/nginx/snippets/spa.conf;

    location ~ ^/(api|auth|calendar|docs|redoc|openapi\.json|health|ready)(/|$) {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://customer_backend;
    }
}

server {
    listen 8003;

    include /etc/nginx/snippets/spa.conf;

    location ~ ^/(api|auth|calendar|docs|redoc|openapi\.json|health|ready)(/|$) {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://backoffice_backend;
    }
}
