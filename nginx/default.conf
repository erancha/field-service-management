# Reverse proxy + static SPA host. Each role is served on its own port, so on this machine the
# OAuth callback host is localhost:<port>, the only loopback form Google accepts as a redirect URI
# (it rejects *.localhost); on the EC2 instance each port is the origin of its role's CloudFront
# distribution. nginx serves the shared single-page app and forwards the API surface to that
# role's backend; the blocks differ only by listen port and upstream.
include /etc/nginx/snippets/upstreams.conf;

server {
    listen 8001;

    include /etc/nginx/snippets/spa.conf;

    location ~ ^/(api|auth|calendar|docs|redoc|openapi\.json|health|ready)(/|$) {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://technician_backend;
    }
}

server {
    listen 8002;

    include /etc/nginx/snippets/spa.conf;

    location ~ ^/(api|auth|calendar|docs|redoc|openapi\.json|health|ready)(/|$) {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://customer_backend;
    }
}

server {
    listen 8003;

    include /etc/nginx/snippets/spa.conf;

    location ~ ^/(api|auth|calendar|docs|redoc|openapi\.json|health|ready)(/|$) {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://backoffice_backend;
    }
}
