# Shared upstream-proxy headers so the backend sees the original host and client, not the proxy.
# $http_host keeps the :port (unlike $host, which drops it); the backend needs it to build the OAuth
# callback URL as localhost:<port>, the host this role is reached on.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# The /api/events SSE stream must reach the client incrementally and stay open, so responses are not
# buffered and the upstream read timeout is long. The other API responses are small, so disabling
# buffering for them costs nothing.
proxy_buffering off;
proxy_read_timeout 3600s;

# Knowledge-base uploads are capped by the backend (kb_routes.MAX_UPLOAD_MB), which answers with a
# JSON error the UI can show. This limit must stay just above that cap so nginx's HTML 413 fires only
# for grossly oversized bodies, leaving the user-facing rejection to the backend; raising the backend
# cap without raising this one silently moves the rejection back to nginx.
client_max_body_size 21m;
