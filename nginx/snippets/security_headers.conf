# Baseline security headers for every SPA response. Included inside each location block rather
# than at server level: nginx discards all inherited add_header directives in any location that
# declares its own (the caching locations do), and server-level placement would also impose this
# CSP on proxied backend pages such as /docs, whose Swagger UI loads from a CDN.
#
# The CSP allows only same-origin resources — the built app loads no external scripts, styles,
# fonts, or images, and its SSE stream is same-origin. Sign-in redirects to Google are top-level
# navigations, which CSP does not restrict. frame-ancestors 'none' (with X-Frame-Options for older
# browsers) blocks framing; base-uri, form-action, and object-src do not inherit from default-src,
# so they are pinned explicitly. "always" keeps the headers on error responses too.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
