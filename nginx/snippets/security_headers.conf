# Baseline security headers for every SPA response. Included inside each location block rather
# than at server level: nginx discards all inherited add_header directives in any location that
# declares its own (the caching locations do), and server-level placement would also impose this
# CSP on proxied backend pages such as /docs, whose Swagger UI loads from a CDN.
#
# The CSP allows only same-origin resources, except the landing page's font: landing.css, shared
# byte for byte with the other apps' landing pages, loads Heebo from Google Fonts, its stylesheet
# from fonts.googleapis.com and its font files from fonts.gstatic.com. The app loads no external
# scripts or images, and its SSE stream is same-origin. Sign-in redirects to Google are top-level
# navigations, which CSP does not restrict. frame-ancestors 'none' (with X-Frame-Options for older
# browsers) blocks framing; base-uri, form-action, and object-src do not inherit from default-src,
# so they are pinned explicitly. "always" keeps the headers on error responses too.
add_header Strict-Transport-Security $hsts_header always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
