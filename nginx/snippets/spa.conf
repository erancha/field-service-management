# Static serving for the single-page app. Unknown paths fall back to index.html so client-side
# routing works on deep links; hashed /assets/ files are immutable, index.html must never be cached
# or a deploy would keep serving stale asset references.
root /usr/share/nginx/html;
index index.html;

location = /index.html {
    include /etc/nginx/snippets/security_headers.conf;
    add_header Cache-Control "no-cache";
}

location /assets/ {
    include /etc/nginx/snippets/security_headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location / {
    include /etc/nginx/snippets/security_headers.conf;
    try_files $uri /index.html;
}
