# Certificate material for the public edge. The lineage is pinned to the name "fsm" (certbot's
# --cert-name) so this path is stable no matter which hostname is listed first at issuance; all three
# role hostnames are names on that one certificate.
ssl_certificate     /etc/letsencrypt/live/fsm/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/fsm/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
