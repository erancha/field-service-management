# Shared http-context configuration for both edges: the per-port localhost edge used by local runs
# (default.conf) and the per-hostname TLS edge used by a public deployment (public.conf.template).
# Exactly one of those two is ever present in conf.d, so these directives are defined once.

# Each name resolves to every replica of that role on the compose network, so a role scaled past one
# process is load-balanced without naming the replicas here.
upstream technician_backend { server technician:8001; }
upstream customer_backend   { server customer:8002; }
upstream backoffice_backend { server backoffice:8003; }

# Hashed asset filenames make long-lived caching safe; compress text payloads on the wire.
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Carries HSTS only where it is meaningful and safe. nginx omits a header whose value is empty, so
# the plain-http localhost edge sends none — asserting HSTS there would pin the browser to https for
# every localhost port on the machine, breaking unrelated local development in a way that persists
# long after this container is gone.
map $scheme $hsts_header {
    https   "max-age=31536000";
    default "";
}
