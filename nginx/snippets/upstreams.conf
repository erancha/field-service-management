# The edge's http-context directives, which default.conf includes ahead of its server blocks.

# Each name resolves to every replica of that role on the compose network, so a role scaled past one
# process is load-balanced without naming the replicas here.
upstream technician_backend { server technician:8001; }
upstream customer_backend   { server customer:8002; }
upstream backoffice_backend { server backoffice:8003; }

# Hashed asset filenames make long-lived caching safe; compress text payloads on the wire.
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Carries HSTS only where nginx itself serves https. nginx omits a header whose value is empty, so
# the plain-http edge sends none: asserting HSTS on localhost would pin the browser to https for
# every localhost port on the machine, breaking unrelated local development in a way that persists
# long after this container is gone. Behind CloudFront the edge sees plain http too, so it sends
# none there either.
map $scheme $hsts_header {
    https   "max-age=31536000";
    default "";
}
