# What changes when the stack runs on the EC2 instance of loan-simulator's stack;
# scripts/deploy.sh --ec2 passes this file after docker-compose.yml. The images are built on the
# deployer's machine for the instance's ARM processor, under their own tags so the local stack's
# images stay as they are. The edge publishes each role on the instance's address at the role's
# edge port, where the security group admits only CloudFront; Postgres, Redis and the object store
# stay on the instance's loopback interface, and the role replicas are not published. The
# services start again after the instance stops and starts; the migration runs once per deploy.
#
# Each role is reached at the https address of its own CloudFront distribution, which
# scripts/common.sh exports as EC2_<ROLE>_URL. The callbacks Google returns a sign-in to are set
# from it rather than derived from the request: CloudFront reaches the edge over plain HTTP, so a
# derived callback would name http. APP_ENV prod marks the session cookie Secure, since people
# reach the roles over HTTPS only.
x-ec2-backend: &ec2-backend
  image: fsm-backend:ec2
  platform: linux/arm64
  restart: unless-stopped

# One replica per role: the instance's 2 GB of memory serves loan-simulator's stack too, and the
# local replica counts (technician 2, customer 5) would need about twice what it has.
x-ec2-single: &ec2-single
  deploy:
    replicas: 1

services:
  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  objectstore:
    restart: unless-stopped

  migrate:
    image: fsm-backend:ec2
    platform: linux/arm64

  technician:
    <<: [*ec2-backend, *ec2-single]
    environment:
      APP_ENV: prod
      GOOGLE_REDIRECT_URI: "${EC2_TECHNICIAN_URL:?set by scripts/common.sh}/auth/google/callback"
      GOOGLE_CALENDAR_REDIRECT_URI: "${EC2_TECHNICIAN_URL:?set by scripts/common.sh}\
        /calendar/connect/callback"

  customer:
    <<: [*ec2-backend, *ec2-single]
    environment:
      APP_ENV: prod
      GOOGLE_REDIRECT_URI: "${EC2_CUSTOMER_URL:?set by scripts/common.sh}/auth/google/callback"

  backoffice:
    <<: *ec2-backend
    environment:
      APP_ENV: prod
      GOOGLE_REDIRECT_URI: "${EC2_BACKOFFICE_URL:?set by scripts/common.sh}/auth/google/callback"

  # The photo links the dispatcher writes into calendar events open the technician app.
  worker:
    <<: *ec2-backend
    environment:
      APP_ENV: prod
      TECHNICIAN_APP_URL: "${EC2_TECHNICIAN_URL:?set by scripts/common.sh}"

  # Published as in docker-compose.yml, on every interface at the three edge ports, each the
  # origin port of its role's stack (EC2_ORIGIN_PORT).
  nginx:
    image: fsm-nginx:ec2
    platform: linux/arm64
    restart: unless-stopped
